# Deploy OVH — GitHub Actions
# Secrets: OVH_HOST, OVH_SSH_KEY, VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_OVH,
#          VITE_GOOGLE_MAPS_API_KEY
# Variables: DEPLOY_BASE_URL_OVH (https://tsx.book-store.com.pl), OVH_USER (optional),
#            VITE_GOOGLE_MAPS_MAP_ID, VITE_STORE_NAME / VITE_STORE_LATITUDE / VITE_STORE_LONGITUDE (optional)
name: Deploy to OVH

on:
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_USER: ${{ vars.OVH_USER || 'ubuntu' }}
      OVH_SSH_PORT: "49152"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        env:
          VITE_DEPLOY_TARGET: ovh
          VITE_BACKEND_URL: ${{ vars.DEPLOY_BASE_URL_OVH || 'https://tsx.book-store.com.pl' }}/api
          VITE_BACKEND_URL_OVH: ${{ vars.DEPLOY_BASE_URL_OVH || 'https://tsx.book-store.com.pl' }}/api
          VITE_ASSET_URL: ${{ vars.DEPLOY_BASE_URL_OVH || 'https://tsx.book-store.com.pl' }}
          VITE_APP_NAME: BookStore
          VITE_LANGUAGE: pl
          VITE_CURRENCY: pln
          VITE_TAX: "0"
          VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_OVH: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY_TEST_MODE_OVH }}
          VITE_STRIPE_CONFIRMPAYMENT_URL_OVH: ${{ vars.DEPLOY_BASE_URL_OVH || 'https://tsx.book-store.com.pl' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_STORE_NAME: ${{ vars.VITE_STORE_NAME || 'BookStore' }}
          VITE_STORE_LATITUDE: ${{ vars.VITE_STORE_LATITUDE }}
          VITE_STORE_LONGITUDE: ${{ vars.VITE_STORE_LONGITUDE }}
        run: |
          npm ci
          npm ci --prefix frontend
          npm run build

      - name: Prepare release archive
        run: |
          RELEASE_DIR="release-${{ github.sha }}"
          mkdir -p "$RELEASE_DIR"
          rsync -a \
            --exclude node_modules \
            --exclude .git \
            --exclude cypress \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/cypress' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude 'frontend/.env.local' \
            ./ "$RELEASE_DIR/"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Rsync to OVH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ${{ env.RELEASE_DIR }}/
          remote_path: /var/www/tsx-book-store/releases/${{ github.sha }}/
          remote_host: ${{ secrets.OVH_HOST }}
          remote_port: ${{ env.OVH_SSH_PORT }}
          remote_user: ${{ env.DEPLOY_USER }}
          remote_key: ${{ secrets.OVH_SSH_KEY }}

      - name: Activate release and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_HOST }}
          port: ${{ env.OVH_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          script: activate-release-tsx.sh ${{ github.sha }}

      - name: Smoke test (public URL)
        if: vars.DEPLOY_BASE_URL_OVH != ''
        env:
          DEPLOY_BASE_URL_OVH: ${{ vars.DEPLOY_BASE_URL_OVH }}
        run: bash deploy-ovh/smoke-test.sh
